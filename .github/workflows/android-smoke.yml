name: Boleto Rush — smoke test on real Android emulator

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'scripts/smoke_android.sh'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --console=plain
      - name: Start Android emulator and verify app opens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          script: bash scripts/smoke_android.sh
      - name: Save REAL emulator screenshots and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoletoRush-1.5.0-rc1-SCREENSHOTS-REAIS
          path: smoke-output/
          retention-days: 14
          if-no-files-found: warn
