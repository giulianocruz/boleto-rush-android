name: Boleto Rush — Release APK regression (Android 8 + 15)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/smoke_android.sh'
      - '.github/workflows/android-release-smoke.yml'

permissions:
  contents: read

jobs:
  release-regression:
    name: Release APK Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build RELEASE rather than debug
        shell: bash
        run: bash ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain
      - name: QA-sign release APK with disposable CI-only key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/boleto-qa.jks -alias boleto-qa -storepass android -keypass android -dname "CN=Boleto QA Test Only" -keyalg RSA -keysize 2048 -validity 30
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -n "$signer"
          "$signer" sign --ks /tmp/boleto-qa.jks --ks-key-alias boleto-qa --ks-pass pass:android --key-pass pass:android --out /tmp/boleto-release-qa.apk "$unsigned"
          "$signer" verify --verbose /tmp/boleto-release-qa.apk
      - name: Launch and finish game on real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BOLETO_TEST_APK: /tmp/boleto-release-qa.apk
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          script: bash scripts/smoke_android.sh
      - name: Save logs and authentic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoletoRush-release-Android${{ matrix.api }}-QA-evidence
          path: smoke-output/
          retention-days: 14
          if-no-files-found: warn
