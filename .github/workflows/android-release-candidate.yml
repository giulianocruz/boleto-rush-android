name: Boleto Rush — QA APK + Signed Play AAB

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BOLETO_ADMOB_APP_ID: ${{ secrets.BOLETO_ADMOB_APP_ID }}
      BOLETO_REWARDED_UNIT_ID: ${{ secrets.BOLETO_REWARDED_UNIT_ID }}
      BOLETO_UPLOAD_STORE_PASSWORD: ${{ secrets.BOLETO_UPLOAD_STORE_PASSWORD }}
      BOLETO_UPLOAD_KEY_ALIAS: ${{ secrets.BOLETO_UPLOAD_KEY_ALIAS }}
      BOLETO_UPLOAD_KEY_PASSWORD: ${{ secrets.BOLETO_UPLOAD_KEY_PASSWORD }}
      BOLETO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BOLETO_UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional publisher upload key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BOLETO_UPLOAD_KEYSTORE_BASE64" ]; then
            : "${BOLETO_UPLOAD_STORE_PASSWORD:?Missing signing secret}"
            : "${BOLETO_UPLOAD_KEY_ALIAS:?Missing signing secret}"
            : "${BOLETO_UPLOAD_KEY_PASSWORD:?Missing signing secret}"
            printf '%s' "$BOLETO_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boleto-upload.jks"
            chmod 600 "$RUNNER_TEMP/boleto-upload.jks"
            echo "BOLETO_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/boleto-upload.jks" >> "$GITHUB_ENV"
            echo "BOLETO_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "BOLETO_SIGNED=false" >> "$GITHUB_ENV"
            echo "No publisher key supplied: QA APK only. Release bundle is deliberately skipped."
          fi

      - name: Build and test independent QA APK
        run: bash ./gradlew :app:verifyPlayIdentity :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 --console=plain

      - name: Validate QA APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='br.com.proximaera.boletorush.qa'"
          echo "QA APK verified; debug always uses Google sample ad IDs."

      - name: APK for installation (debug signing, QA ONLY)
        uses: actions/upload-artifact@v4
        with:
          name: BoletoRush-2.3.11-QA-APK-TESTE
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build signed Play AAB (publisher secrets required)
        if: env.BOLETO_SIGNED == 'true'
        run: bash ./gradlew :app:verifyPlayConfiguration :app:bundleRelease --no-daemon --max-workers=2 --console=plain

      - name: Verify signed Play AAB
        if: env.BOLETO_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$aab"
          unzip -t "$aab" | tail -1
          jarsigner -verify -strict "$aab" > /dev/null
          echo "Signed upload AAB and non-demo AdMob IDs verified."

      - name: AAB signed for Play Console
        if: env.BOLETO_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BoletoRush-2.3.11-AAB-PLAY-ASSINADO
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Store graphics and listing package
        uses: actions/upload-artifact@v4
        with:
          name: BoletoRush-2.3.11-KIT-LOJA
          path: |
            store/play-icon-512.png
            store/feature-graphic-1024x500.jpg
            PLAY_CONSOLE_GUIA.md
            PLAY_STORE_LISTING.md
            PRIVACIDADE.md
          retention-days: 14
          if-no-files-found: warn

      - name: Erase temporary publisher key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/boleto-upload.jks"
